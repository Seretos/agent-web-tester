name: lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin.json is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Validate release docs and skill frontmatter
        run: python3 .github/scripts/validate_release_docs.py

      - name: Validate manifest parity
        run: python3 .github/scripts/validate_manifests.py

      - name: Validate page-scanner subagent package
        run: python3 .github/scripts/validate_agents.py

      - name: Validate scaffold-bdd skill package
        run: python3 .github/scripts/validate_scaffold.py

      - name: Validate author-scenario skill package
        run: python3 .github/scripts/validate_author_scenario.py

      - name: Validate record-scenario skill package
        run: python3 .github/scripts/validate_record.py

  release-scripts:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run release-script tests
        run: python tests/test_release_scripts.py

  browser-bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install xvfb (headed Chromium needs a display; AGENTS.md forbids --headless)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run browser bootstrap driving tests (live)
        env:
          AWT_LIVE_BROWSER: "1"
        run: xvfb-run -a python3 tests/test_browser_bootstrap.py

  bddgen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run bddgen step-file driving tests (live)
        env:
          AWT_LIVE_BDDGEN: "1"
        run: python3 tests/test_bddgen_step_files.py
