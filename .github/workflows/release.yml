name: release

# Manual release flow:
#   1. Trigger via Actions tab -> "Run workflow" -> enter version (e.g. 0.0.1)
#      or via CLI: gh workflow run release.yml -f version=0.0.1
#   2. Workflow stamps version into plugin.json (in CI only), pushes an orphan
#      release branch with install-ready files, creates the
#      agent-web-tester--v{version} tag on that commit, and publishes a
#      GitHub Release with the zip attached.
#   3. The workflow then notifies agent-marketplace directly via
#      MARKETPLACE_DISPATCH_TOKEN.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (semver, no leading v) e.g. 0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate version is semver
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # Strict semver grammar (no leading zeros, no build metadata) --
          # duplicated verbatim in .github/scripts/prev-release-tag.sh's
          # SEMVER_RE. tests/test_release_scripts.py::test_regex_parity
          # asserts the two stay byte-identical.
          if [[ ! "$V" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?$ ]]; then
            echo "::error::Version '$V' is not valid semver (expected MAJOR.MINOR.PATCH[-PRERELEASE], no leading zeros, no build metadata)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Pre-flight: tags and source markers"
        id: preflight
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PLUGIN_NAME=$(jq -r '.name' .claude-plugin/plugin.json)
          TAG="${PLUGIN_NAME}--v${{ inputs.version }}"
          MAIN_SHA=$(git rev-parse HEAD)

          if gh api "repos/${{ github.repository }}/git/refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists. Delete it first or pick a new version."
            exit 1
          fi

          # The src/<TAG> marker (pushed later, unconditionally, in "Push
          # source marker tag") must not already exist. Versions are
          # immutable: a collision here means a previous, burned attempt at
          # this exact version left a marker behind. Never delete or move
          # it -- a failed build gets a *new* version number instead.
          if gh api "repos/${{ github.repository }}/git/refs/tags/src/${TAG}" >/dev/null 2>&1; then
            echo "::error::Marker tag src/${TAG} already exists. It is never deleted or moved automatically -- pick a new version."
            exit 1
          fi

          # Resolve the previous release by strict semver precedence over
          # the existing <plugin>--v* tags (never src/* markers -- see
          # prev-release-tag.sh). Empty PREV_TAG means this is the first
          # release ever, which is allowed: previous_tag_name is simply
          # omitted from the notes call later.
          # Invoked via "bash <path>", not directly: the script's committed
          # git mode is 100644 (this repo has core.filemode=false, so the
          # working-tree executable bit is not reliably what lands in the
          # tree object a Linux CI runner materializes), so direct execution
          # risks "Permission denied" on a checkout that honors the recorded
          # mode bit-for-bit.
          PREV_TAG=$(git tag --list "${PLUGIN_NAME}--v*" | bash .github/scripts/prev-release-tag.sh "$TAG")

          if [ -n "$PREV_TAG" ]; then
            if ! gh api "repos/${{ github.repository }}/git/refs/tags/src/${PREV_TAG}" >/dev/null 2>&1; then
              echo "::error::Marker tag src/${PREV_TAG} is missing, so release notes for ${TAG} would have no starting point on main."
              echo "::error::GITHUB_TOKEN can never create this marker itself (it would be a historical commit whose workflow tree differs from main's tip -- see AGENTS.md)."
              echo "::error::One-time manual bootstrap required -- from the head_sha of ${PREV_TAG}'s own successful release.yml run:"
              echo "::error::  git tag src/${PREV_TAG} <head_sha>"
              echo "::error::  git push origin src/${PREV_TAG}"
              exit 1
            fi
          fi

          echo "tag=${TAG}"           >> "$GITHUB_OUTPUT"
          echo "main_sha=${MAIN_SHA}" >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Stamp version into plugin manifests (in CI only)
        shell: bash
        run: |
          V="${{ inputs.version }}"
          # Both plugin manifests (Claude + Codex) get the same version.
          for manifest in .claude-plugin/plugin.json .codex-plugin/plugin.json; do
            tmp=$(mktemp)
            jq --arg v "$V" '.version = $v' "$manifest" > "$tmp"
            mv "$tmp" "$manifest"
          done
          echo "Stamped version $V"

      - name: Stage install tree and build release zip
        id: stage
        shell: bash
        run: |
          STAGE="build/stage/agent-web-tester"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/.claude-plugin" "$STAGE/.codex-plugin" "$STAGE/skills"
          cp .claude-plugin/plugin.json "$STAGE/.claude-plugin/"
          cp .codex-plugin/plugin.json  "$STAGE/.codex-plugin/"
          cp -a skills/. "$STAGE/skills/"
          cp README.md "$STAGE/"
          cp LICENSE "$STAGE/" 2>/dev/null || true
          # assets/ goes onto the orphan release branch so the dispatch
          # payload's icon URL (raw.githubusercontent.com/${repo}/${TAG}/
          # assets/icon.png) resolves.
          [ -d assets ] && cp -a assets "$STAGE/" || true
          # description.md ships onto the orphan release branch so the dispatch
          # payload's description_url resolves at the tagged commit.
          [ -f description.md ] && cp -a description.md "$STAGE/" || true
          # agents/ ships so Claude Code's convention-discovered subagent
          # loading (<plugin-root>/agents/*.md) finds page-scanner.md.
          [ -d agents ] && cp -a agents "$STAGE/" || true
          # docs/ ships so page-scanner.md's worked-example link resolves
          # for installed users, not just in this source checkout.
          [ -d docs ] && cp -a docs "$STAGE/" || true

          mkdir -p dist
          ZIPNAME="agent-web-tester-${{ inputs.version }}.zip"
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/$ZIPNAME" .)

          echo "stage=$STAGE"      >> "$GITHUB_OUTPUT"
          echo "zip=dist/$ZIPNAME" >> "$GITHUB_OUTPUT"

      # Marks the main commit this release was cut from, so release notes
      # can later be generated on main's real history (see "Create tag and
      # GitHub Release" below) instead of against the orphan release
      # branch, which shares no history with anything. Pushed unconditionally
      # -- no "skip if exists" guard -- because Pre-flight already proved
      # src/$TAG is absent; a skip-if-exists guard would silently keep a
      # stale marker from a previously failed run and produce empty notes
      # again next time. Placed after the build succeeded (this step) and
      # before the orphan push, so a build failure leaves no marker behind.
      - name: Push source marker tag
        shell: bash
        run: |
          git tag "src/${{ steps.preflight.outputs.tag }}" "${{ steps.preflight.outputs.main_sha }}"
          git push origin "src/${{ steps.preflight.outputs.tag }}"

      - name: Push orphan release branch and capture commit
        id: rel
        shell: bash
        run: |
          STAGE="${{ steps.stage.outputs.stage }}"
          ZIP="${{ steps.stage.outputs.zip }}"
          if [ ! -d "$STAGE" ]; then
            echo "::error::staging dir $STAGE not produced"; exit 1
          fi
          if [ ! -f "$ZIP" ]; then
            echo "::error::release zip $ZIP not produced"
            ls -la dist/ || true
            exit 1
          fi

          # Stash staging tree AND the release zip outside the worktree, since
          # "git checkout --orphan" + clean will wipe dist/ before we attach
          # the zip to the GitHub Release.
          TMP=$(mktemp -d)
                    # .gitattributes MUST ship on the orphan release branch: Claude Code clones it,
          # and on a Windows machine with core.autocrlf=true (Git-for-Windows default)
          # a checkout without `* text=auto eol=lf` writes CRLF into the plugin cache —
          # and Claude Code silently ignores CRLF skills/agents. (Rebuild incident 2026-08-23.)
          for ga in .gitattributes stamped/.gitattributes; do
            if [ -f "$ga" ]; then cp -a "$ga" "$STAGE/"; break; fi
          done
          cp -a "$STAGE"/. "$TMP/"
          ASSET_DIR=$(mktemp -d)
          cp "$ZIP" "$ASSET_DIR/"
          echo "asset=$ASSET_DIR/$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

          # marketplace-payload.sh lives under .github/scripts, which "git rm
          # -rf . && git clean -fdx" below deletes along with the rest of
          # the main-branch worktree. Stash a copy outside the worktree, the
          # same way the staged tree and zip are stashed above, so the
          # Dispatch step can still invoke it after the orphan checkout.
          SCRIPTS_DIR=$(mktemp -d)
          cp .github/scripts/marketplace-payload.sh "$SCRIPTS_DIR/"
          echo "scripts=$SCRIPTS_DIR" >> "$GITHUB_OUTPUT"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout --orphan release
          git rm -rf . > /dev/null 2>&1 || true
          git clean -fdx > /dev/null 2>&1 || true

          leftover=$(find . -mindepth 1 -maxdepth 1 -not -name '.git' || true)
          if [ -n "$leftover" ]; then
            echo "::error::working tree not empty after clean:"; echo "$leftover"; exit 1
          fi

          cp -a "$TMP"/. .

          echo "=== release branch contents ==="
          find . -mindepth 1 -not -path './.git*' | sort

          git add -A
          git commit -m "release: v${{ inputs.version }}"
          git push origin release --force

          SHA=$(git rev-parse HEAD)
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.preflight.outputs.tag }}"
          MAIN_SHA="${{ steps.preflight.outputs.main_sha }}"
          PREV_TAG="${{ steps.preflight.outputs.prev_tag }}"

          # $TAG itself lives on a parentless orphan commit that shares no
          # history with anything, so --generate-notes / --notes-start-tag
          # against $TAG would find no merge-base and always produce empty
          # notes (the bug this ticket fixes) -- do not "simplify" this back.
          # src/$TAG and src/$PREV_TAG are ordinary commits on main, so
          # asking for notes between THOSE instead gives a real PR list and
          # a working compare link.
          NOTES_ARGS=(-f "tag_name=src/${TAG}" -f "target_commitish=${MAIN_SHA}")
          if [ -n "$PREV_TAG" ]; then
            NOTES_ARGS+=(-f "previous_tag_name=src/${PREV_TAG}")
          fi
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            "${NOTES_ARGS[@]}" \
            --jq .body > "$RUNNER_TEMP/notes.md"

          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.rel.outputs.sha }}" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            ${{ contains(inputs.version, '-') && '--prerelease' || '' }} \
            "${{ steps.rel.outputs.asset }}"

      # Tags created via GITHUB_TOKEN don't fire downstream push:tags workflows
      # (Actions blocks this to prevent recursive loops). Call the marketplace
      # directly with a separate PAT.
      - name: Dispatch to agent-marketplace
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT:   ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          REPO:     ${{ github.repository }}
          VERSION:  ${{ inputs.version }}
          TAG:      ${{ steps.preflight.outputs.tag }}
        run: |
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          DESCRIPTION=$(jq -r '.description' .claude-plugin/plugin.json)
          CATEGORY="skill"

          # The changelog is read back from the *published* release body
          # (real notes generated from main's history in "Create tag and
          # GitHub Release" above) -- never from a fresh generate-notes call
          # against the orphan tag, which would reproduce the empty-notes
          # bug. `&&`, not `;`: `set -e` does not propagate a failure out of
          # a `$(...)` substitution on its own, so the `&& printf x` sentinel
          # is what lets a `gh` failure be told apart from a body that
          # legitimately ends in blank lines, before stripping exactly the
          # one trailing newline `--jq .body` always adds.
          CHANGELOG=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body && printf x)
          CHANGELOG="${CHANGELOG%x}"
          CHANGELOG="${CHANGELOG%$'\n'}"

          # Invoked via "bash <path>", not directly -- same executable-bit
          # rationale as the prev-release-tag.sh call in Pre-flight above.
          NAME="$NAME" DESCRIPTION="$DESCRIPTION" REPO="$REPO" CATEGORY="$CATEGORY" \
            VERSION="$VERSION" TAG="$TAG" CHANGELOG="$CHANGELOG" \
            bash "${{ steps.rel.outputs.scripts }}/marketplace-payload.sh" > "$RUNNER_TEMP/payload.json"

          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Seretos/agent-marketplace/dispatches \
            -d @"$RUNNER_TEMP/payload.json"
